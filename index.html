<!doctype html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>Recipes</title>
<meta name='description' content='Step-by-step recipes, one move at a time.'>
<link rel='icon' href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23C98A2C'/%3E%3C/svg%3E">
<link rel='stylesheet' href='style.css'>
</head>
<body>
<div id='scrim'></div>
<aside id='sidebar' aria-hidden='true'>
  <div class='sidebar-top'>
    <input id='searchInput' type='search' placeholder='Search recipes…' aria-label='Search recipes'>
    <button id='closeSidebar' aria-label='Close'>✕</button>
  </div>
  <ul id='recipeList'></ul>
</aside>

<header class='topbar'>
  <div class='topbar-left'>
    <button id='homeBtn' class='icon-btn' aria-label='Back to all recipes' hidden>
      <svg viewBox='0 0 24 24'><path d='M3 11l9-7 9 7'/><path d='M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9'/></svg>
    </button>
    <button id='menuBtn' class='icon-btn' aria-label='Open recipe list'>
      <svg viewBox='0 0 24 24'><line x1='3' y1='6' x2='21' y2='6'/><line x1='3' y1='12' x2='21' y2='12'/><line x1='3' y1='18' x2='21' y2='18'/></svg>
    </button>
  </div>
  <h1 id='headerTitle'>Recipes</h1>
  <div class='topbar-right'>
    <button id='viewToggle' class='icon-btn' aria-label='Show all steps' hidden>
      <svg viewBox='0 0 24 24'><rect x='3' y='4' width='18' height='4' rx='1'/><rect x='3' y='10' width='18' height='4' rx='1'/><rect x='3' y='16' width='18' height='4' rx='1'/></svg>
    </button>
    <div id='timePill' class='time-pill' hidden></div>
  </div>
</header>

<main id='main'>
  <section id='home'>
    <ul id='homeList' class='home-list'></ul>
  </section>

  <section id='stage' hidden>
    <button class='click-zone left' id='zoneLeft' aria-label='Previous step'></button>
    <button class='click-zone right' id='zoneRight' aria-label='Next step'></button>
    <div class='step' id='stepView'>
      <div class='step-icon' id='stepIcon'></div>
      <h2 class='step-title' id='stepTitle'></h2>
      <p class='step-text' id='stepText'></p>
    </div>
    <footer class='progress'>
      <div class='dots' id='dots'></div>
      <div class='counter' id='counter'></div>
    </footer>
  </section>

  <section id='listView' hidden>
    <ol id='listItems' class='list-items'></ol>
  </section>
</main>

<script src='app.js'></script>
</body>
</html>
